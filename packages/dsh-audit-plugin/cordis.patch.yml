# ============================================================================
# dsh-cost-audit —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加，本文件把审计插件
# 插入 profile 的配置树。
#
# 条目 id 故意用 dsh-cost-audit 而不是 dsh-audit：
# npm 上已有一个叫 dsh-audit 的包（xiaoxiao2026，做"插件生态体检"），
# 与本插件（会话成本审计）是两件事，但同时安装会撞 loader 条目 id 空间。
#
# 安装（bundle 形态下只需一条命令）：
#   dsh plugin --profile web add dsh-audit-plugin
# 本地开发：
#   dsh plugin --profile web add file:<本目录绝对路径>
#
# 装完后在 Web UI 的「插件」页勾选启用，它会写入 profile 的 dsh.profile.bundles。
# 注意：必须是 insert 形式 —— id+name 只能修改已有条目，凭空新增会被跳过并告警。
# ============================================================================

- insert:
    - id: dsh-cost-audit
      name: dsh-audit-plugin
